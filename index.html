<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEKER HOTEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <style>
    :root {
      --bg: #f4efe7;
      --bg-2: #e9dfd1;
      --card: rgba(255,255,255,.82);
      --card-solid: #ffffff;
      --text: #1b1712;
      --muted: #6f6557;
      --gold: #b88943;
      --gold-2: #8d6328;
      --line: rgba(64, 44, 20, .12);
      --shadow: 0 28px 80px rgba(64, 34, 8, .12);
      --shadow-soft: 0 16px 32px rgba(64, 34, 8, .08);
      --radius: 28px;
      --radius-sm: 18px;
      --nav-h: 82px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Montserrat", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(184,137,67,.20), transparent 30%),
        radial-gradient(circle at top right, rgba(255,255,255,.75), transparent 18%),
        linear-gradient(180deg, #f8f4ed 0%, #f0e6d7 52%, #f6f1ea 100%);
      min-height: 100vh;
      padding-bottom: calc(var(--nav-h) + 18px);
    }

    img, video { display: block; max-width: 100%; }
    button, select, input, textarea { font: inherit; }
    button { border: 0; }
    a { color: inherit; text-decoration: none; }

    .container {
      width: min(1160px, calc(100% - 28px));
      margin: 0 auto;
    }

    .glass {
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.48);
      box-shadow: var(--shadow-soft);
    }

    .hero-shell {
      padding: 16px 14px 0;
    }

    .hero {
      position: relative;
      min-height: 290px;
      border-radius: 0 0 34px 34px;
      overflow: hidden;
      color: #fff;
      background: #2a231c;
      box-shadow: var(--shadow);
    }

    .hero-media-wrap,
    .hero-overlay {
      position: absolute;
      inset: 0;
    }

    .hero-media-wrap img,
    .hero-media-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(var(--hero-zoom, 1.02));
    }

    .hero-overlay {
      background: linear-gradient(rgba(15, 12, 9, .34), rgba(15, 12, 9, .58));
      z-index: 1;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      padding: 18px 0 26px;
      min-height: 290px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .18em;
      opacity: .88;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border-radius: 999px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.12);
      color: #fff;
      backdrop-filter: blur(10px);
    }

    .pill select {
      border: 0;
      background: transparent;
      color: #fff;
      outline: none;
      min-width: 84px;
      cursor: pointer;
    }

    .pill select option { color: #111; }

    .pill-btn,
    .wa-btn,
    .ghost-btn,
    .soft-btn,
    .icon-btn {
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
    }

    .pill-btn:hover,
    .wa-btn:hover,
    .ghost-btn:hover,
    .soft-btn:hover,
    .icon-btn:hover {
      transform: translateY(-1px);
    }

    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border-radius: 999px;
      padding: 12px 16px;
      color: #fff;
      background: linear-gradient(135deg, #27c266, #16964a);
      box-shadow: 0 16px 26px rgba(20, 125, 62, .24);
      font-weight: 700;
    }

    .pill-btn {
      border-radius: 999px;
      padding: 11px 15px;
      color: #fff;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.16);
    }

    .hero-copy {
      max-width: 760px;
      padding-top: 18px;
    }

    .hero-copy h1 {
      margin: 0 0 10px;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(38px, 6vw, 62px);
      line-height: .94;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .hero-copy p {
      margin: 0;
      max-width: 560px;
      color: rgba(255,255,255,.92);
      line-height: 1.7;
      font-size: 14px;
    }

    .mini-board-wrap {
      margin-top: -18px;
      position: relative;
      z-index: 5;
    }

    .mini-board {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 12px;
      align-items: start;
    }

    .rates-box,
    .calc-box,
    .slider-box,
    .section-card,
    .service-card,
    .gallery-empty,
    .admin-panel,
    .editor-modal-card,
    .auth-card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.58);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-soft);
    }

    .rates-box {
      border-radius: 22px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .rate-card {
      border-radius: 16px;
      padding: 9px 10px;
      background: rgba(255,255,255,.92);
      border: 1px solid var(--line);
      min-height: 58px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .rate-card small {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .rate-card strong {
      color: var(--gold-2);
      font-size: 15px;
      line-height: 1;
    }

    .calc-box {
      border-radius: 22px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .calc-title,
    .slider-title,
    .section-title-row h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .03em;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
    }

    .calc-grid select,
    .calc-grid input {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.94);
      padding: 11px 12px;
      outline: none;
    }

    .calc-toggle {
      border-radius: 14px;
      padding: 0 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #fff;
      font-weight: 700;
    }

    .calc-result {
      font-size: 13px;
      color: var(--muted);
      min-height: 20px;
    }

    .section {
      padding: 22px 0 0;
    }

    .slider-box,
    .section-card {
      border-radius: 28px;
      padding: 18px;
    }

    .slider-box {
      margin-top: 18px;
    }

    .slider-head,
    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .slider-title-wrap p,
    .section-title-row p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .banner-stage {
      position: relative;
      height: 210px;
      overflow: hidden;
      border-radius: 24px;
      background: linear-gradient(135deg, #3d2c19, #8d6328);
      cursor: pointer;
    }

    .banner-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity .55s ease;
    }

    .banner-slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .banner-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10,10,10,.08), rgba(10,10,10,.62));
    }

    .banner-copy {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      z-index: 2;
      color: #fff;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-end;
    }

    .banner-copy strong {
      display: block;
      font-size: 22px;
      line-height: 1.05;
    }

    .banner-copy span {
      display: block;
      margin-top: 6px;
      font-size: 13px;
      color: rgba(255,255,255,.86);
    }

    .banner-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }

    .banner-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(113, 81, 41, .28);
      border: 0;
      cursor: pointer;
    }

    .banner-dot.active {
      background: var(--gold);
      transform: scale(1.08);
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .category-card {
      position: relative;
      overflow: hidden;
      min-height: 120px;
      border-radius: 22px;
      padding: 0;
      background: #ddd;
      color: #fff;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      text-align: left;
    }

    .category-card.active {
      outline: 2px solid rgba(184,137,67,.42);
      box-shadow: 0 18px 34px rgba(132, 95, 38, .20);
    }

    .card-media,
    .card-overlay {
      position: absolute;
      inset: 0;
    }

    .card-media img,
    .card-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-overlay {
      background: linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.62));
    }

    .category-content {
      position: relative;
      z-index: 1;
      min-height: inherit;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px;
    }

    .category-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.16);
      backdrop-filter: blur(8px);
      font-size: 18px;
    }

    .category-content h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
      max-width: 95%;
      word-break: break-word;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .chip {
      width: 100%;
      min-height: 48px;
      border-radius: 16px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.92);
      color: var(--text);
      font-weight: 600;
      line-height: 1.25;
      word-break: break-word;
      cursor: pointer;
    }

    .chip.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #fff;
      border-color: transparent;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .service-card {
      border-radius: 26px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      position: relative;
    }

    .service-media {
      position: relative;
      height: 180px;
      background: #ddd;
    }

    .badge-row {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      z-index: 2;
      align-items: flex-start;
    }

    .badge,
    .duration {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 999px;
      color: #fff;
      font-size: 11px;
      backdrop-filter: blur(10px);
    }

    .badge { background: rgba(184,137,67,.92); }
    .duration { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.16); }

    .service-body {
      padding: 16px;
      display: grid;
      gap: 12px;
      flex: 1;
    }

    .service-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.15;
      font-family: "Cormorant Garamond", serif;
    }

    .service-desc {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
      white-space: pre-line;
    }

    .service-meta {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .price-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .price {
      font-size: 25px;
      font-weight: 800;
      color: var(--gold-2);
    }

    .old-price {
      font-size: 14px;
      color: #a29a8f;
      text-decoration: line-through;
    }

    .free-tag {
      display: inline-flex;
      padding: 8px 11px;
      border-radius: 999px;
      background: #e6f7ed;
      color: #1d7a46;
      font-size: 13px;
      font-weight: 800;
    }

    .request-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 15px;
      padding: 12px 15px;
      color: #fff;
      background: linear-gradient(135deg, #22c55e, #16964a);
      box-shadow: 0 14px 24px rgba(22, 150, 74, .22);
      font-weight: 700;
      cursor: pointer;
    }

    .admin-tools {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 6;
      display: none;
      gap: 6px;
      flex-direction: column;
    }

    .is-admin .admin-tools { display: flex; }

    .admin-mini {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(0,0,0,.44);
      border: 1px solid rgba(255,255,255,.16);
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .gallery-empty {
      border-radius: 22px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .gallery-card {
      border-radius: 18px;
      overflow: hidden;
      background: #ddd;
      min-height: 130px;
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      min-height: 130px;
      object-fit: cover;
    }

    .footer {
      padding: 28px 0 10px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .mobile-nav {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 70;
      width: min(430px, calc(100% - 20px));
      border-radius: 24px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(255,255,255,.90);
      border: 1px solid rgba(255,255,255,.65);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 46px rgba(64, 34, 8, .18);
    }

    .nav-btn {
      min-height: 54px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(245,236,226,.96));
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 700;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 120;
      min-width: 240px;
      max-width: min(92vw, 360px);
      border-radius: 18px;
      padding: 14px 16px;
      background: rgba(27, 23, 18, .92);
      color: #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,.22);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: .25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .modal,
    .auth-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(21, 16, 10, .44);
      backdrop-filter: blur(6px);
    }

    .modal.open,
    .auth-modal.open {
      display: grid;
    }

    .editor-modal-card,
    .auth-card {
      width: min(860px, 100%);
      max-height: min(88vh, 940px);
      overflow: auto;
      border-radius: 28px;
      padding: 20px;
      background: rgba(255,255,255,.96);
    }

    .auth-card { width: min(420px, 100%); }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 24px;
      font-family: "Cormorant Garamond", serif;
    }

    .close-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #f4ede3;
      color: var(--text);
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .02em;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 12px 13px;
      outline: none;
    }

    .field textarea {
      min-height: 102px;
      resize: vertical;
    }

    .field-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .soft-btn,
    .ghost-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .soft-btn {
      color: #fff;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
    }

    .ghost-btn {
      background: #f3eadf;
      color: var(--text);
    }

    .danger-btn {
      background: #fff1f1;
      color: #ba3838;
    }

    .admin-panel {
      margin-top: 18px;
      border-radius: 24px;
      padding: 16px;
      display: none;
    }

    .is-admin .admin-panel {
      display: block;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 12px;
    }

    .admin-box {
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.86);
      padding: 14px;
    }

    .admin-box h4 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .admin-list {
      display: grid;
      gap: 8px;
    }

    .admin-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: #faf7f2;
      border: 1px solid var(--line);
      font-size: 13px;
    }

    .admin-row span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .admin-row-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .tiny-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #efe5d8;
      cursor: pointer;
      color: var(--text);
    }

    .hidden { display: none !important; }

    @media (max-width: 980px) {
      .mini-board,
      .admin-grid,
      .form-grid,
      .services-grid,
      .categories-grid,
      .gallery-grid {
        grid-template-columns: 1fr 1fr;
      }

      .filters {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .hero-shell {
        padding: 10px 8px 0;
      }

      .hero {
        min-height: 230px;
        border-radius: 0 0 24px 24px;
      }

      .hero-inner {
        min-height: 230px;
        padding: 12px 0 16px;
      }

    const seedData = JSON.parse(document.getElementById("seedDataJson").textContent.trim());

    const state = {
      data: hydrateData(loadState() || seedData),
      currentLang: "hy",
      activeCategory: "all",
      isAdmin: false,
      calcMode: "TO_TRY",
      bannerIndex: 0,
      bannerTimer: null,
      githubSaving: false
    };

    const $ = (id) => document.getElementById(id);

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function hydrateData(data) {
      const clone = structuredClone(data);

      clone.categories = Array.isArray(clone.categories) ? clone.categories : [];
      clone.services = Array.isArray(clone.services) ? clone.services : [];
      clone.guestPosts = Array.isArray(clone.guestPosts) ? clone.guestPosts : [];
      clone.banners = Array.isArray(clone.banners) && clone.banners.length ? clone.banners : buildDefaultBanners(clone.categories);
      clone.settings = clone.settings || {};
      clone.settings.whatsappUrl = clone.settings.whatsappUrl || "https://wa.me/905375120434?utm_source=chatgpt.com";
      clone.settings.adminPin = clone.settings.adminPin || "1234";
      clone.settings.github = clone.settings.github || {
        enabled: false,
        token: "",
        owner: "",
        repo: "",
        path: "index.html",
        branch: "main",
        sha: ""
      };

      if (clone.hotel && !clone.hotel.media) {
        clone.hotel.media = FALLBACK_MEDIA.hotel;
      }

      return clone;
    }

    function buildDefaultBanners(categories) {
      return (categories || []).slice(0, 4).map((cat, index) => ({
        id: "banner_" + (index + 1),
        image: resolveMedia(cat),
        targetCategoryId: cat.id,
        title: t(cat.name, "hy"),
        subtitle: "Tap to open",
        sort: index + 1
      }));
    }

    function t(obj, lang = state.currentLang) {
      return obj?.[lang] || obj?.en || obj?.tr || obj?.hy || "";
    }

    function setText(id, value) {
      const el = $(id);
      if (el) el.textContent = value;
    }

    function resolveMedia(item) {
      if (!item) return FALLBACK_MEDIA.default;
      const media = item.media || "";
      if (media && !String(media).startsWith("idb://")) return media;

      if (item.cat && FALLBACK_MEDIA[item.cat]) return FALLBACK_MEDIA[item.cat];
      if (item.id && FALLBACK_MEDIA[item.id]) return FALLBACK_MEDIA[item.id];
      if (item.icon && item.id && FALLBACK_MEDIA[item.id]) return FALLBACK_MEDIA[item.id];
      if (item.id && FALLBACK_MEDIA[item.id?.replace(/^srv_/, "")]) return FALLBACK_MEDIA[item.id.replace(/^srv_/, "")];

      return FALLBACK_MEDIA[item.id] || FALLBACK_MEDIA.default;
    }

    function mediaMarkup(item, className = "card-media") {
      const src = resolveMedia(item);

      if (item?.mediaType === "video" && src && !String(src).startsWith("idb://")) {
        return `
          <div class="${className}">
            <video autoplay muted loop playsinline>
              <source src="${src}">
            </video>
          </div>
        `;
      }

      return `
        <div class="${className}">
          <img src="${src}" alt="">
        </div>
      `;
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function saveState({ syncGithub = true } = {}) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      document.getElementById("seedDataJson").textContent = JSON.stringify(state.data, null, 2);
      updateGithubStatus();
      showToast("Saved");
      if (syncGithub) debouncedGithubSave();
    }

    function updateGithubStatus() {
      const g = state.data.settings.github;
      $("githubStatusText").textContent = g.enabled && g.owner && g.repo
        ? `GitHub auto save is ON: ${g.owner}/${g.repo} -> ${g.path}`
        : "GitHub auto save is OFF";
    }

    function isFree(service) {
      return service.price === 0 || service.price === "0" || service.price === "" || service.price == null;
    }

    function getAdjustedRate(code) {
      const map = {
        USD: Number(state.data.rates.usd || 0),
        EUR: Number(state.data.rates.eur || 0),
        RUB: Number(state.data.rates.rub || 0)
      };
      if (!map[code]) return 0;
      return Math.max(0, map[code] - 1);
    }

    function renderHeader() {
      setText("brandName", state.data.hotel.name || "PEKER HOTEL");
      setText("hotelSubtitle", t(uiText.hotelSubtitle));
      setText("heroTitle", t(state.data.hotel.title));
      setText("heroText", t(state.data.hotel.text));
      setText("categoriesTitle", t(uiText.categoriesTitle));
      setText("categoriesText", t(uiText.categoriesText));
      setText("servicesTitle", t(uiText.servicesTitle));
      setText("servicesText", t(uiText.servicesText));
      setText("galleryTitle", t(uiText.galleryTitle));
      setText("galleryText", t(uiText.galleryText));
      setText("footerText", t(uiText.footer));
      setText("sliderTitle", t(uiText.sliderTitle));
      setText("sliderText", t(uiText.sliderText));
      setText("calcTitle", t(uiText.calcTitle));
      $("globalWhatsappBtn").href = state.data.settings.whatsappUrl;

      document.documentElement.lang = state.currentLang;
      document.title = `${state.data.hotel.name || "PEKER HOTEL"} - ${t(state.data.hotel.title)}`;

      $("heroMedia").innerHTML = mediaMarkup(state.data.hotel, "hero-media-wrap");
      $("hero").style.minHeight = (window.innerWidth <= 700 ? Math.max(230, (state.data.hotel.height || 360) * 0.62) : Math.max(290, (state.data.hotel.height || 360) * 0.78)) + "px";
      $("hero").style.setProperty("--hero-zoom", state.data.hotel.zoom || 1.02);
      $("heroOverlay").style.background = `linear-gradient(rgba(15,12,9,${state.data.hotel.dim || 0.34}), rgba(15,12,9,${Math.min(.78, (state.data.hotel.dim || 0.34) + 0.26)}))`;
    }

    function renderRates() {
      const list = [
        { label: "USD", value: getAdjustedRate("USD") },
        { label: "EUR", value: getAdjustedRate("EUR") },
        { label: "RUB", value: getAdjustedRate("RUB") },
        { label: "Margin", value: Number(state.data.rates.margin || 0), suffix: "%" }
      ];

      $("ratesBox").innerHTML = list.map(item => `
        <div class="rate-card">
          <small>${item.label}</small>
          <strong>${item.suffix ? item.value.toFixed(0) + item.suffix : item.value.toFixed(2)}</strong>
        </div>
      `).join("");
    }

    function renderCalculator() {
      const currency = $("calcCurrency").value;
      const amount = Number($("calcAmount").value || 0);

      if (!amount) {
        $("calcResult").textContent = "";
        return;
      }

      if (currency === "TRY") {
        $("calcResult").textContent = `${amount.toFixed(2)} TRY`;
        return;
      }

      const rate = getAdjustedRate(currency);
      if (!rate) {
        $("calcResult").textContent = "No rate";
        return;
      }

      if (state.calcMode === "TO_TRY") {
        const result = amount * rate;
        $("calcResult").textContent = `${amount.toFixed(2)} ${currency} = ${result.toFixed(2)} TRY`;
      } else {
        const result = amount / rate;
        $("calcResult").textContent = `${amount.toFixed(2)} TRY = ${result.toFixed(2)} ${currency}`;
      }
    }

    function renderSlider() {
      const banners = [...(state.data.banners || [])].sort((a, b) => (a.sort || 0) - (b.sort || 0));
      const stage = $("bannerStage");
      const dots = $("bannerDots");
      $("editSliderBtn").classList.toggle("hidden", !state.isAdmin);

      if (!banners.length) {
        stage.innerHTML = `
          <div class="banner-slide active">
            <img src="${FALLBACK_MEDIA.hotel}" alt="">
            <div class="banner-overlay"></div>
            <div class="banner-copy">
              <div>
                <strong>${state.data.hotel.name || "PEKER HOTEL"}</strong>
                <span>${t(uiText.sliderText)}</span>
              </div>
            </div>
          </div>
        `;
        dots.innerHTML = "";
        return;
      }

      if (state.bannerIndex >= banners.length) state.bannerIndex = 0;

      stage.innerHTML = banners.map((banner, index) => `
        <div class="banner-slide ${index === state.bannerIndex ? "active" : ""}" data-index="${index}">
          <img src="${banner.image || FALLBACK_MEDIA.hotel}" alt="">
          <div class="banner-overlay"></div>
          <div class="banner-copy">
            <div>
              <strong>${escapeHtml(banner.title || "")}</strong>
              <span>${escapeHtml(banner.subtitle || "")}</span>
            </div>
            ${state.isAdmin ? `
              <div class="admin-tools" style="display:flex;position:static;flex-direction:row;">
                <button class="admin-mini" onclick="editBanner('${banner.id}')"><i class="fa-solid fa-pen"></i></button>
                <button class="admin-mini" onclick="moveBanner('${banner.id}', -1)"><i class="fa-solid fa-arrow-up"></i></button>
                <button class="admin-mini" onclick="moveBanner('${banner.id}', 1)"><i class="fa-solid fa-arrow-down"></i></button>
              </div>
            ` : ""}
          </div>
        </div>
      `).join("");

      stage.onclick = () => {
        const banner = banners[state.bannerIndex];
        if (!banner) return;
        state.activeCategory = banner.targetCategoryId || "all";
        renderAll();
        document.getElementById("categoriesGrid").scrollIntoView({ behavior: "smooth", block: "start" });
      };

      dots.innerHTML = banners.map((_, index) => `
        <button class="banner-dot ${index === state.bannerIndex ? "active" : ""}" data-index="${index}"></button>
      `).join("");

      dots.querySelectorAll(".banner-dot").forEach(dot => {
        dot.addEventListener("click", () => {
          state.bannerIndex = Number(dot.dataset.index);
          renderSlider();
          startBannerTimer();
        });
      });
    }

    function startBannerTimer() {
      clearInterval(state.bannerTimer);
      state.bannerTimer = setInterval(() => {
        const len = (state.data.banners || []).length;
        if (len <= 1) return;
        state.bannerIndex = (state.bannerIndex + 1) % len;
        renderSlider();
      }, 2000);
    }

    function renderCategories() {
      const wrap = $("categoriesGrid");
      wrap.innerHTML = "";

      state.data.categories.forEach((category, index) => {
        const btn = document.createElement("button");
        btn.className = "category-card" + (state.activeCategory === category.id ? " active" : "");
        btn.innerHTML = `
          ${mediaMarkup(category)}
          <div class="card-overlay"></div>
          <div class="category-content">
            <div class="category-icon"><i class="fa-solid ${category.icon || "fa-layer-group"}"></i></div>
            <h3>${escapeHtml(t(category.name))}</h3>
          </div>
          <div class="admin-tools">
            <button class="admin-mini" title="Edit" onclick="event.stopPropagation(); editCategory('${category.id}')"><i class="fa-solid fa-pen"></i></button>
            <button class="admin-mini" title="Up" onclick="event.stopPropagation(); moveCategory('${category.id}', -1)"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="admin-mini" title="Down" onclick="event.stopPropagation(); moveCategory('${category.id}', 1)"><i class="fa-solid fa-arrow-down"></i></button>
          </div>
        `;
        btn.addEventListener("click", () => {
          state.activeCategory = category.id;
          renderAll();
          $("servicesGrid").scrollIntoView({ behavior: "smooth", block: "start" });
        });
        wrap.appendChild(btn);
      });
    }

    function renderFilters() {
      const allChip = `
        <button class="chip ${state.activeCategory === "all" ? "active" : ""}" data-id="all">
          ${escapeHtml(t(uiText.all))}
        </button>
      `;

      const chips = state.data.categories.map(category => `
        <button class="chip ${state.activeCategory === category.id ? "active" : ""}" data-id="${category.id}">
          ${escapeHtml(t(category.name))}
        </button>
      `).join("");

      $("filters").innerHTML = allChip + chips;

      $("filters").querySelectorAll(".chip").forEach(chip => {
        chip.addEventListener("click", () => {
          state.activeCategory = chip.dataset.id;
          renderAll();
        });
      });
    }

    function priceHTML(service) {
      if (isFree(service)) {
        return `<span class="free-tag">${escapeHtml(t(uiText.free))}</span>`;
      }
      const old = service.oldPrice ? `<span class="old-price">${escapeHtml(service.currency || "")}${escapeHtml(service.oldPrice)}</span>` : "";
      return `
        <div class="price-box">
          <span class="price">${escapeHtml(service.currency || "")}${escapeHtml(service.price)}</span>
          ${old}
        </div>
      `;
    }

    function buildWhatsAppUrl(service) {
      const title = t(service.title);
      const category = state.data.categories.find(c => c.id === service.cat);
      const catName = category ? t(category.name) : service.cat;
      const lines = [
        `${state.data.hotel.name || "PEKER HOTEL"}`,
        `${t(uiText.requestMessage)}`,
        `${catName}`,
        `${title}`
      ];

      if (!isFree(service)) {
        lines.push(`${service.currency || ""}${service.price}`);
      }

      const base = state.data.settings.whatsappUrl || "https://wa.me/905375120434?utm_source=chatgpt.com";
      const text = encodeURIComponent(lines.join("\n"));
      return base.includes("?") ? `${base}&text=${text}` : `${base}?text=${text}`;
    }

    function renderServices() {
      const list = state.activeCategory === "all"
        ? state.data.services
        : state.data.services.filter(service => service.cat === state.activeCategory);

      const servicesGrid = $("servicesGrid");
      servicesGrid.innerHTML = "";

      if (!list.length) {
        servicesGrid.innerHTML = `<div class="gallery-empty">${escapeHtml(t(uiText.noServices))}</div>`;
        return;
      }

      list.forEach(service => {
        const article = document.createElement("article");
        article.className = "service-card";
        article.innerHTML = `
          <div class="service-media">
            ${mediaMarkup(service)}
            <div class="card-overlay"></div>
            <div class="badge-row">
              ${service.popular ? `<span class="badge"><i class="fa-solid fa-star"></i>${escapeHtml(t(uiText.popular))}</span>` : `<span></span>`}
              ${service.duration ? `<span class="duration"><i class="fa-regular fa-clock"></i>${escapeHtml(service.duration)}</span>` : `<span></span>`}
            </div>
            <div class="admin-tools">
              <button class="admin-mini" title="Edit" onclick="editService('${service.id}')"><i class="fa-solid fa-pen"></i></button>
              <button class="admin-mini" title="Up" onclick="moveService('${service.id}', -1)"><i class="fa-solid fa-arrow-up"></i></button>
              <button class="admin-mini" title="Down" onclick="moveService('${service.id}', 1)"><i class="fa-solid fa-arrow-down"></i></button>
            </div>
          </div>

          <div class="service-body">
            <h3 class="service-title">${escapeHtml(t(service.title))}</h3>
            <p class="service-desc">${escapeHtml(t(service.desc))}</p>
            <div class="service-meta">
              ${priceHTML(service)}
              <a class="request-btn" href="${buildWhatsAppUrl(service)}" target="_blank" rel="noopener">
                <i class="fa-brands fa-whatsapp"></i>
                ${escapeHtml(t(uiText.request))}
              </a>
            </div>
          </div>
        `;
        servicesGrid.appendChild(article);
      });
    }

    function renderGallery() {
      const guestPosts = state.data.guestPosts || [];
      const wrap = $("galleryContent");

      if (!guestPosts.length) {
        wrap.innerHTML = `<div class="gallery-empty">${escapeHtml(t(uiText.noGallery))}</div>`;
        return;
      }

      wrap.innerHTML = `
        <div class="gallery-grid">
          ${guestPosts.map(post => `
            <div class="gallery-card">
              <img src="${post.image || FALLBACK_MEDIA.hotel_guests}" alt="">
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderAll() {
      document.body.classList.toggle("is-admin", state.isAdmin);
      setText("adminBtnLabel", state.isAdmin ? "Admin On" : "Admin");
      renderHeader();
      renderRates();
      renderCalculator();
      renderSlider();
      renderCategories();
      renderFilters();
      renderServices();
      renderGallery();
      updateGithubStatus();
    }

    function moveItem(array, id, direction) {
      const index = array.findIndex(item => item.id === id);
      if (index < 0) return;
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= array.length) return;
      [array[index], array[newIndex]] = [array[newIndex], array[index]];
      saveState();
      renderAll();
    }

    function resizeHeight(item, delta) {
      item.h = Math.max(90, Number(item.h || 140) + delta);
    }

    function openModal(title, html) {
      $("editorTitle").textContent = title;
      $("editorBody").innerHTML = html;
      $("editorModal").classList.add("open");
    }

    function closeModal() {
      $("editorModal").classList.remove("open");
      $("editorBody").innerHTML = "";
    }

    function openAuth() {
      $("authModal").classList.add("open");
      $("adminPinInput").value = "";
    }

    function closeAuth() {
      $("authModal").classList.remove("open");
    }

    function bindImageInput(inputId, previewId, callback) {
      const input = $(inputId);
      const preview = $(previewId);
      if (!input) return;
      input.addEventListener("change", async () => {
        const file = input.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result;
          if (preview) preview.value = base64;
          callback(base64);
        };
        reader.readAsDataURL(file);
      });
    }

    function editHero() {
      const hotel = state.data.hotel;
      openModal("Edit Hero", `
        <div class="form-grid">
          <div class="field full">
            <label>Hero Image URL</label>
            <input id="heroMediaInput" value="${escapeHtml(resolveMedia(hotel))}">
          </div>
          <div class="field full">
            <label>Or Upload Image</label>
            <input type="file" id="heroMediaFile" accept="image/*">
          </div>
          <div class="field">
            <label>Height</label>
            <input id="heroHeightInput" type="number" value="${Number(hotel.height || 360)}">
          </div>
          <div class="field">
            <label>Dim</label>
            <input id="heroDimInput" type="number" step="0.01" value="${Number(hotel.dim || 0.42)}">
          </div>
          <div class="field">
            <label>Zoom</label>
            <input id="heroZoomInput" type="number" step="0.01" value="${Number(hotel.zoom || 1.04)}">
          </div>
          <div class="field">
            <label>Name</label>
            <input id="heroNameInput" value="${escapeHtml(hotel.name || "PEKER HOTEL")}">
          </div>
          <div class="field full">
            <label>Title (${state.currentLang})</label>
            <input id="heroTitleInput" value="${escapeHtml(t(hotel.title))}">
          </div>
          <div class="field full">
            <label>Text (${state.currentLang})</label>
            <textarea id="heroTextInput">${escapeHtml(t(hotel.text))}</textarea>
          </div>
          <div class="field-row full">
            <button class="soft-btn" id="saveHeroEditor"><i class="fa-solid fa-check"></i> Save</button>
          </div>
        </div>
      `);

      bindImageInput("heroMediaFile", "heroMediaInput", (base64) => {
        $("heroMediaInput").value = base64;
      });

      $("saveHeroEditor").onclick = () => {
        hotel.media = $("heroMediaInput").value.trim();
        hotel.mediaType = "image";
        hotel.height = Number($("heroHeightInput").value || 360);
        hotel.dim = Number($("heroDimInput").value || 0.42);
        hotel.zoom = Number($("heroZoomInput").value || 1.04);
        hotel.name = $("heroNameInput").value.trim() || hotel.name;
        hotel.title[state.currentLang] = $("heroTitleInput").value.trim();
        hotel.text[state.currentLang] = $("heroTextInput").value.trim();
        saveState();
        renderAll();
        closeModal();
      };
    }

    function editRates() {
      openModal("Edit Rates", `
        <div class="form-grid">
          <div class="field">
            <label>USD rate</label>
            <input id="rateUsd" type="number" step="0.01" value="${Number(state.data.rates.usd || 0)}">
          </div>
          <div class="field">
            <label>EUR rate</label>
            <input id="rateEur" type="number" step="0.01" value="${Number(state.data.rates.eur || 0)}">
          </div>
          <div class="field">
            <label>RUB rate</label>
            <input id="rateRub" type="number" step="0.01" value="${Number(state.data.rates.rub || 0)}">
          </div>
          <div class="field">
            <label>Margin %</label>
            <input id="rateMargin" type="number" step="0.01" value="${Number(state.data.rates.margin || 1)}">
          </div>
          <div class="field full">
            <label>Note</label>
            <input value="Displayed rate is always 1 TRY less automatically" disabled>
          </div>
          <div class="field-row full">
            <button class="soft-btn" id="saveRatesEditor"><i class="fa-solid fa-check"></i> Save</button>
          </div>
        </div>
      `);

      $("saveRatesEditor").onclick = () => {
        state.data.rates.usd = Number($("rateUsd").value || 0);
        state.data.rates.eur = Number($("rateEur").value || 0);
        state.data.rates.rub = Number($("rateRub").value || 0);
        state.data.rates.margin = Number($("rateMargin").value || 1);
        saveState();
        renderAll();
        closeModal();
      };
    }

    function editCategory(id) {
      const item = state.data.categories.find(x => x.id === id);
      if (!item) return;

      openModal("Edit Category", `
        <div class="form-grid">
          <div class="field">
            <label>ID</label>
            <input id="catId" value="${escapeHtml(item.id)}" disabled>
          </div>
          <div class="field">
            <label>Icon class</label>
            <input id="catIcon" value="${escapeHtml(item.icon || "fa-layer-group")}">
          </div>
          <div class="field full">
            <label>Image URL</label>
            <input id="catMedia" value="${escapeHtml(resolveMedia(item))}">
          </div>
          <div class="field full">
            <label>Or Upload Image</label>
            <input type="file" id="catMediaFile" accept="image/*">
          </div>
          <div class="field">
            <label>Height</label>
            <input id="catHeight" type="number" value="${Number(item.h || 140)}">
          </div>
          <div class="field">
            <label>Title (${state.currentLang})</label>
            <input id="catName" value="${escapeHtml(t(item.name))}">
          </div>
          <div class="field-row full">
            <button class="ghost-btn" id="catSmaller"><i class="fa-solid fa-minus"></i> Smaller</button>
            <button class="ghost-btn" id="catBigger"><i class="fa-solid fa-plus"></i> Bigger</button>
            <button class="soft-btn" id="saveCategoryEditor"><i class="fa-solid fa-check"></i> Save</button>
          </div>
        </div>
      `);

      bindImageInput("catMediaFile", "catMedia", (base64) => {
        $("catMedia").value = base64;
      });

      $("catSmaller").onclick = () => {
        $("catHeight").value = Math.max(90, Number($("catHeight").value || item.h || 140) - 10);
      };
      $("catBigger").onclick = () => {
        $("catHeight").value = Number($("catHeight").value || item.h || 140) + 10;
      };
      $("saveCategoryEditor").onclick = () => {
        item.icon = $("catIcon").value.trim() || item.icon;
        item.media = $("catMedia").value.trim();
        item.mediaType = "image";
        item.h = Number($("catHeight").value || 140);
        item.name[state.currentLang] = $("catName").value.trim();
        saveState();
        renderAll();
        closeModal();
      };
    }

    function editService(id) {
      const item = state.data.services.find(x => x.id === id);
      if (!item) return;

      openModal("Edit Menu Item", `
        <div class="form-grid">
          <div class="field">
            <label>ID</label>
            <input value="${escapeHtml(item.id)}" disabled>
          </div>
          <div class="field">
            <label>Category</label>
            <select id="srvCat">
              ${state.data.categories.map(cat => `
                <option value="${cat.id}" ${item.cat === cat.id ? "selected" : ""}>${escapeHtml(t(cat.name))}</option>
              `).join("")}
            </select>
          </div>
          <div class="field full">
            <label>Image URL</label>
            <input id="srvMedia" value="${escapeHtml(resolveMedia(item))}">
          </div>
          <div class="field full">
            <label>Or Upload Image</label>
            <input type="file" id="srvMediaFile" accept="image/*">
          </div>
          <div class="field">
            <label>Height</label>
            <input id="srvHeight" type="number" value="${Number(item.h || 176)}">
          </div>
          <div class="field">
            <label>Popular</label>
            <select id="srvPopular">
              <option value="true" ${item.popular ? "selected" : ""}>Yes</option>
              <option value="false" ${!item.popular ? "selected" : ""}>No</option>
            </select>
          </div>
          <div class="field">
            <label>Title (${state.currentLang})</label>
            <input id="srvTitle" value="${escapeHtml(t(item.title))}">
          </div>
          <div class="field">
            <label>Duration</label>
            <input id="srvDuration" value="${escapeHtml(item.duration || "")}">
          </div>
          <div class="field full">
            <label>Description (${state.currentLang})</label>
            <textarea id="srvDesc">${escapeHtml(t(item.desc))}</textarea>
          </div>
          <div class="field-row full">
            <button class="ghost-btn" id="srvSmaller"><i class="fa-solid fa-minus"></i> Smaller</button>
            <button class="ghost-btn" id="srvBigger"><i class="fa-solid fa-plus"></i> Bigger</button>
            <button class="soft-btn" id="saveServiceEditor"><i class="fa-solid fa-check"></i> Save</button>
          </div>
        </div>
      `);

      bindImageInput("srvMediaFile", "srvMedia", (base64) => {
        $("srvMedia").value = base64;
      });

      $("srvSmaller").onclick = () => {
        $("srvHeight").value = Math.max(110, Number($("srvHeight").value || item.h || 176) - 10);
      };
      $("srvBigger").onclick = () => {
        $("srvHeight").value = Number($("srvHeight").value || item.h || 176) + 10;
      };
      $("saveServiceEditor").onclick = () => {
        item.cat = $("srvCat").value;
        item.media = $("srvMedia").value.trim();
        item.mediaType = "image";
        item.h = Number($("srvHeight").value || 176);
        item.popular = $("srvPopular").value === "true";
        item.duration = $("srvDuration").value.trim();
        item.title[state.currentLang] = $("srvTitle").value.trim();
        item.desc[state.currentLang] = $("srvDesc").value.trim();
        saveState();
        renderAll();
        closeModal();
      };
    }

    function editBanner(id) {
      const item = state.data.banners.find(x => x.id === id);
      if (!item) return;

      openModal("Edit Banner", `
        <div class="form-grid">
          <div class="field full">
            <label>Image URL</label>
            <input id="bannerImage" value="${escapeHtml(item.image || "")}">
          </div>
          <div class="field full">
            <label>Or Upload Image</label>
            <input type="file" id="bannerImageFile" accept="image/*">
          </div>
          <div class="field">
            <label>Title</label>
            <input id="bannerTitle" value="${escapeHtml(item.title || "")}">
          </div>
          <div class="field">
            <label>Subtitle</label>
            <input id="bannerSubtitle" value="${escapeHtml(item.subtitle || "")}">
          </div>
          <div class="field full">
            <label>Target Category</label>
            <select id="bannerTarget">
              ${state.data.categories.map(cat => `
                <option value="${cat.id}" ${item.targetCategoryId === cat.id ? "selected" : ""}>${escapeHtml(t(cat.name))}</option>
              `).join("")}
            </select>
          </div>
          <div class="field-row full">
            <button class="ghost-btn danger-btn" id="deleteBannerBtn"><i class="fa-solid fa-trash"></i> Delete</button>
            <button class="soft-btn" id="saveBannerEditor"><i class="fa-solid fa-check"></i> Save</button>
          </div>
        </div>
      `);

      bindImageInput("bannerImageFile", "bannerImage", (base64) => {
        $("bannerImage").value = base64;
      });

      $("deleteBannerBtn").onclick = () => {
        state.data.banners = state.data.banners.filter(x => x.id !== id);
        saveState();
        renderAll();
        closeModal();
      };

      $("saveBannerEditor").onclick = () => {
        item.image = $("bannerImage").value.trim();
        item.title = $("bannerTitle").value.trim();
        item.subtitle = $("bannerSubtitle").value.trim();
        item.targetCategoryId = $("bannerTarget").value;
        saveState();
        renderAll();
        closeModal();
      };
    }

    function addBanner() {
      const newId = "banner_" + Date.now();
      state.data.banners.push({
        id: newId,
        image: FALLBACK_MEDIA.hotel,
        title: "New Banner",
        subtitle: "Tap to open",
        targetCategoryId: state.data.categories[0]?.id || "all",
        sort: state.data.banners.length + 1
      });
      saveState();
      editBanner(newId);
    }

    function openGithubSettings() {
      const g = state.data.settings.github;

      openModal("GitHub Auto Save", `
        <div class="form-grid">
          <div class="field">
            <label>Enabled</label>
            <select id="ghEnabled">
              <option value="true" ${g.enabled ? "selected" : ""}>On</option>
              <option value="false" ${!g.enabled ? "selected" : ""}>Off</option>
            </select>
          </div>
          <div class="field">
            <label>Admin PIN</label>
            <input id="adminPinEditor" value="${escapeHtml(state.data.settings.adminPin || "1234")}">
          </div>
          <div class="field full">
            <label>GitHub Token</label>
            <input id="ghToken" value="${escapeHtml(g.token || "")}" placeholder="ghp_...">
          </div>
          <div class="field">
            <label>Owner</label>
            <input id="ghOwner" value="${escapeHtml(g.owner || "")}" placeholder="username">
          </div>
          <div class="field">
            <label>Repo</label>
            <input id="ghRepo" value="${escapeHtml(g.repo || "")}" placeholder="repo-name">
          </div>
          <div class="field">
            <label>Path</label>
            <input id="ghPath" value="${escapeHtml(g.path || "index.html")}" placeholder="index.html">
          </div>
          <div class="field">
            <label>Branch</label>
            <input id="ghBranch" value="${escapeHtml(g.branch || "main")}" placeholder="main">
          </div>
          <div class="field full">
            <label>Note</label>
            <textarea disabled>This page saves changes to browser local storage immediately. If GitHub is enabled and token/repo are correct, it also automatically updates your index.html on GitHub.</textarea>
          </div>
          <div class="field-row full">
            <button class="soft-btn" id="saveGithubSettingsBtn"><i class="fa-solid fa-check"></i> Save Settings</button>
          </div>
        </div>
      `);

      $("saveGithubSettingsBtn").onclick = () => {
        g.enabled = $("ghEnabled").value === "true";
        g.token = $("ghToken").value.trim();
        g.owner = $("ghOwner").value.trim();
        g.repo = $("ghRepo").value.trim();
        g.path = $("ghPath").value.trim() || "index.html";
        g.branch = $("ghBranch").value.trim() || "main";
        state.data.settings.adminPin = $("adminPinEditor").value.trim() || "1234";
        saveState({ syncGithub: false });
        updateGithubStatus();
        closeModal();
      };
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "peker-hotel-data.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    async function saveToGithubNow() {
      const g = state.data.settings.github;
      if (!g.enabled || !g.token || !g.owner || !g.repo || !g.path) return;

      if (state.githubSaving) return;
      state.githubSaving = true;

      try {
        const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        const content = btoa(unescape(encodeURIComponent(html)));

        const body = {
          message: "Auto update from hotel admin panel",
          content,
          branch: g.branch || "main"
        };

        if (g.sha) body.sha = g.sha;

        const res = await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${g.path}`, {
          method: "PUT",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${g.token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });

        const json = await res.json();

        if (!res.ok) {
          throw new Error(json?.message || "GitHub save failed");
        }

        state.data.settings.github.sha = json.content?.sha || state.data.settings.github.sha || "";
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
        document.getElementById("seedDataJson").textContent = JSON.stringify(state.data, null, 2);
        showToast("Saved to GitHub");
      } catch (error) {
        console.error(error);
        showToast("GitHub save failed");
      } finally {
        state.githubSaving = false;
      }
    }

    function debouncedGithubSave() {
      clearTimeout(debouncedGithubSave._t);
      debouncedGithubSave._t = setTimeout(saveToGithubNow, 1400);
    }

    function goHome() {
      state.activeCategory = "all";
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function moveToSiblingCategory(step) {
      if (!state.data.categories.length) return;
      const ids = state.data.categories.map(x => x.id);
      let index = ids.indexOf(state.activeCategory);
      if (index === -1) index = 0;
      index += step;
      if (index < 0) index = 0;
      if (index > ids.length - 1) index = ids.length - 1;
      state.activeCategory = ids[index];
      renderAll();
      $("servicesGrid").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    window.editCategory = editCategory;
    window.editService = editService;
    window.editBanner = editBanner;
    window.moveCategory = (id, dir) => moveItem(state.data.categories, id, dir);
    window.moveService = (id, dir) => moveItem(state.data.services, id, dir);
    window.moveBanner = (id, dir) => {
      moveItem(state.data.banners, id, dir);
      state.data.banners.forEach((b, i) => b.sort = i + 1);
      saveState();
    };

    $("languageSelect").value = state.currentLang;
    $("languageSelect").addEventListener("change", (e) => {
      state.currentLang = e.target.value;
      renderAll();
    });

    $("calcCurrency").addEventListener("change", renderCalculator);
    $("calcAmount").addEventListener("input", renderCalculator);
    $("calcDirectionBtn").addEventListener("click", () => {
      state.calcMode = state.calcMode === "TO_TRY" ? "FROM_TRY" : "TO_TRY";
      $("calcDirectionBtn").textContent = state.calcMode === "TO_TRY" ? "FX" : "TRY";
      renderCalculator();
    });

    $("adminToggleBtn").addEventListener("click", () => {
      if (state.isAdmin) {
        state.isAdmin = false;
        renderAll();
        return;
      }
      openAuth();
    });

    $("loginAdminBtn").addEventListener("click", () => {
      const pin = $("adminPinInput").value.trim();
      if (pin === String(state.data.settings.adminPin || "1234")) {
        state.isAdmin = true;
        closeAuth();
        renderAll();
        showToast("Admin mode enabled");
      } else {
        showToast("Wrong PIN");
      }
    });

    $("closeAuthBtn").addEventListener("click", closeAuth);
    $("closeEditorBtn").addEventListener("click", closeModal);
    $("logoutAdminBtn").addEventListener("click", () => {
      state.isAdmin = false;
      renderAll();
      showToast("Admin mode off");
    });

    $("editHeroBtn").addEventListener("click", editHero);
    $("addBannerBtn").addEventListener("click", addBanner);
    $("editRatesBtn").addEventListener("click", editRates);
    $("githubSettingsBtn").addEventListener("click", openGithubSettings);
    $("editSliderBtn").addEventListener("click", addBanner);
    $("saveLocalBtn").addEventListener("click", () => saveState());
    $("exportJsonBtn").addEventListener("click", exportJson);

    $("prevCategoryBtn").addEventListener("click", () => moveToSiblingCategory(-1));
    $("nextCategoryBtn").addEventListener("click", () => moveToSiblingCategory(1));
    $("homeBtn").addEventListener("click", goHome);

    renderAll();
    startBannerTimer();
  </script>
</body>
</html>
