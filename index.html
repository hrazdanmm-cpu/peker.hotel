<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEKER HOTEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <style>
    :root {
      --bg: #f6f1e8;
      --card: rgba(255,255,255,.94);
      --card-2: #ffffff;
      --text: #1f1f1f;
      --muted: #6d6a66;
      --accent: #9a6b2f;
      --accent-dark: #734c1c;
      --line: rgba(0,0,0,.08);
      --shadow: 0 20px 45px rgba(0,0,0,.08);
      --radius: 24px;
      --wa: #1faa59;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Montserrat", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(154,107,47,.12), transparent 28%),
        radial-gradient(circle at top right, rgba(0,0,0,.04), transparent 22%),
        linear-gradient(180deg, #f8f4ee 0%, #f4ede2 100%);
      padding-bottom: 86px;
    }
    img, video { max-width: 100%; display: block; }
    button, select, input, textarea { font: inherit; }
    .container { width: min(1180px, calc(100% - 24px)); margin: 0 auto; }
    .hidden { display: none !important; }

    .hero {
      position: relative;
      min-height: 145px;
      display: flex;
      align-items: center;
      border-radius: 0 0 34px 34px;
      overflow: hidden;
      color: #fff;
      background: #222;
    }
    .hero-media, .hero-overlay {
      position: absolute;
      inset: 0;
    }
    .hero-media img, .hero-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
    }
    .hero-overlay {
      background: linear-gradient(rgba(0,0,0,.42), rgba(0,0,0,.52));
      z-index: 1;
    }
    .hero-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 10px 0 12px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      transform: none;
      width: 100%;
      align-items: center;
      text-align: center;
    }
    .brand-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .brand-sub {
      font-size: 12px;
      opacity: .86;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-left: 0;
    }
    .lang-box, .admin-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      padding: 8px 10px;
      color: #fff;
    }
    .lang-box {
      padding: 8px 12px;
    }
    .lang-box i { font-size: 14px; }
    .lang-box select {
      background: transparent;
      border: 0;
      color: #fff;
      outline: none;
      cursor: pointer;
    }
    .lang-box select option { color: #111; }
    .wa-button, .admin-toggle, .request-btn, .nav-fab, .editor-btn, .small-btn, .save-btn {
      cursor: pointer;
      transition: transform .2s ease, opacity .2s ease, box-shadow .2s ease;
    }
    .wa-button:hover, .admin-toggle:hover, .request-btn:hover, .nav-fab:hover, .editor-btn:hover, .small-btn:hover, .save-btn:hover {
      transform: translateY(-2px);
      opacity: .97;
    }
    .wa-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #21c063, #169a4c);
      border-radius: 999px;
      width: 68px;
      height: 68px;
      padding: 0;
      box-shadow: 0 14px 28px rgba(28, 157, 81, .22);
      font-weight: 700;
      flex: 0 0 auto;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 54;
    }
    .wa-button span { display: none; }
    .wa-button i { font-size: 24px; }
    .admin-toggle {
      width: 34px;
      height: 34px;
      padding: 0;
      justify-content: center;
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 55;
      border-radius: 50%;
      box-shadow: 0 10px 24px rgba(0,0,0,.16);
    }
    .admin-toggle span { display: none; }
    .admin-toggle i { font-size: 12px; }
    .hero-copy { max-width: 760px; }
    .hero-copy h1 {
      margin: 0 0 12px;
      font-size: clamp(20px, 4vw, 38px);
      line-height: .98;
      font-weight: 800;
      letter-spacing: -.03em;
    }
    .hero-copy p {
      margin: 0;
      max-width: 520px;
      font-size: 12px;
      line-height: 1.45;
      color: rgba(255,255,255,.92);
    }

    .section { padding: 22px 0; }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 14px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .section-head h2 {
      margin: 0;
      font-size: clamp(22px, 4vw, 34px);
      line-height: 1.05;
    }
    .section-head p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      max-width: 640px;
    }

    .utility-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 10px;
      position: relative;
      z-index: 5;
    }
    .rates {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      background: transparent;
      backdrop-filter: none;
      border: 0;
      box-shadow: none;
      border-radius: 18px;
      padding: 0;
      width: min(420px, 100%);
    }
    .rate-card {
      background: rgba(246,241,232,.92);
      border: 1px solid rgba(0,0,0,.04);
      border-radius: 16px;
      padding: 6px 8px;
      min-width: 0;
      text-align: center;
    }
    .rate-card small {
      display: block;
      color: var(--muted);
      margin-bottom: 4px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .rate-card strong {
      font-size: 12px;
      color: var(--accent-dark);
      display: block;
      line-height: 1.1;
    }

    .calc-box { display: none; }
    .calc-trigger {
      display: grid;
      place-items: center;
      gap: 4px;
      text-align: center;
      border: 0;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background: rgba(255,255,255,.95);
      color: var(--accent-dark);
      font-weight: 700;
    }
    .calc-trigger i { font-size: 18px; }
    .calc-trigger span {
      font-size: 11px;
      line-height: 1.1;
    }
    .calc-box h3 {
      margin: 0;
      font-size: 14px;
    }
    .calc-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .calc-box input, .calc-box select, .editor-form input, .editor-form textarea, .editor-form select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
      outline: none;
    }
    .calc-result {
      font-size: 13px;
      color: var(--accent-dark);
      min-height: 20px;
      font-weight: 600;
    }

    .slider-wrap {
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.55);
    }
    .slider-stage {
      position: relative;
      height: 220px;
      background: #ddd;
      cursor: pointer;
    }
    .slider-stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .slider-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.6));
    }
    .slider-caption {
      position: absolute;
      z-index: 2;
      left: 18px;
      right: 18px;
      bottom: 18px;
      color: #fff;
    }
    .slider-caption strong {
      display: block;
      font-size: 24px;
      line-height: 1.05;
    }
    .slider-caption span {
      display: block;
      margin-top: 6px;
      font-size: 13px;
      color: rgba(255,255,255,.92);
    }
    .slider-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 12px;
    }
    .slider-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 0;
      background: rgba(154,107,47,.24);
    }
    .slider-dot.active {
      background: var(--accent);
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
    }
    .category-card {
      position: relative;
      border: 0;
      border-radius: 24px;
      overflow: hidden;
      min-height: 124px;
      text-align: left;
      cursor: pointer;
      padding: 0;
      background: #ddd;
      box-shadow: var(--shadow);
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 28px 50px rgba(0,0,0,.14);
    }
    .category-card.active {
      outline: 3px solid rgba(154,107,47,.42);
    }
    .card-media, .card-overlay {
      position: absolute;
      inset: 0;
    }
    .card-media img, .card-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.03);
    }
    .card-overlay {
      background: linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.60));
    }
    .category-content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: end;
      gap: 10px;
      padding: 14px;
      color: #fff;
    }
    .category-content i {
      font-size: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(10px);
    }
    .category-content h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0,0,0,.28);
      word-break: break-word;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 18px;
      padding: 10px 12px;
      cursor: pointer;
      color: var(--text);
      transition: .2s ease;
      min-height: 46px;
      word-break: break-word;
      line-height: 1.25;
      text-align: center;
    }
    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }
    .service-card {
      background: var(--card-2);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,.04);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .service-media {
      position: relative;
      height: 176px;
      background: #ddd;
    }
    .service-media .card-overlay {
      background: linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.42));
    }
    .badge-row {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 8px;
    }
    .badge, .duration {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      color: #fff;
    }
    .badge { background: rgba(154,107,47,.88); }
    .duration {
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.16);
    }
    .service-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }
    .service-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.18;
    }
    .service-desc {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      flex: 1;
      white-space: pre-line;
    }
    .service-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .price-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .price {
      font-size: 27px;
      font-weight: 800;
      color: var(--accent-dark);
    }
    .old-price {
      font-size: 15px;
      color: #9b9893;
      text-decoration: line-through;
    }
    .free-tag {
      font-size: 14px;
      font-weight: 700;
      color: #1d7a46;
      background: #e7f7ee;
      border-radius: 999px;
      padding: 8px 12px;
    }
    .request-btn {
      border: 0;
      background: linear-gradient(135deg, #21c063, #169a4c);
      color: #fff;
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 700;
      box-shadow: 0 14px 28px rgba(28, 157, 81, .18);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    .request-btn i { font-size: 11px; }
    .gallery-empty {
      background: #fff;
      border: 1px dashed rgba(0,0,0,.15);
      border-radius: 24px;
      padding: 26px;
      color: var(--muted);
      text-align: center;
      box-shadow: var(--shadow);
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }
    .gallery-item {
      border-radius: 18px;
      overflow: hidden;
      background: #ddd;
      aspect-ratio: 1 / 1;
      box-shadow: var(--shadow);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .footer {
      padding: 26px 0 42px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    @media (max-width: 700px) {
      body.mobile-category-focus .hero,
      body.mobile-category-focus .utility-grid,
      body.mobile-category-focus .slider-wrap,
      body.mobile-category-focus #gallerySection,
      body.mobile-category-focus .footer,
      body.mobile-category-focus #categoriesGrid,
      body.mobile-category-focus #filters,
      body.mobile-category-focus #categoriesTitle,
      body.mobile-category-focus #categoriesText,
      body.mobile-category-focus #galleryTitle,
      body.mobile-category-focus #galleryText,
      body.mobile-category-focus #footerText,
      body.mobile-category-focus #sliderTitle,
      body.mobile-category-focus #sliderText {
        display: none !important;
      }
      body.mobile-category-focus .section:has(#servicesGrid) {
        padding-top: 10px;
      }
    }
    .empty-state {
      padding: 26px;
      background: #fff;
      border-radius: 22px;
      box-shadow: var(--shadow);
      color: var(--muted);
    }
    .media-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #a77d46, #6f4a1d);
      color: #fff;
      font-size: 28px;
    }

    .admin-tools {
      position: absolute;
      right: 10px;
      top: 10px;
      z-index: 4;
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    body.admin-mode .admin-tools { display: flex; }
    .editor-btn, .small-btn, .save-btn {
      border: 0;
      border-radius: 12px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.48);
      color: #fff;
      backdrop-filter: blur(8px);
    }
    .save-btn {
      width: auto;
      padding: 10px 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    }
    .admin-panel {
      display: none;
      margin-top: 16px;
      background: rgba(255,255,255,.85);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 16px;
      border: 1px solid rgba(255,255,255,.55);
    }
    body.admin-mode .admin-panel { display: block; }
    .admin-panel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .admin-card {
      background: #fff;
      border-radius: 18px;
      padding: 14px;
      border: 1px solid rgba(0,0,0,.06);
    }
    .admin-card h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }
    .admin-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.44);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal.open { display: flex; }
    .modal-card {
      width: min(760px, 100%);
      max-height: 88vh;
      overflow: auto;
      background: #fff;
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-head h3 {
      margin: 0;
      font-size: 22px;
    }
    .close-btn {
      border: 0;
      background: #f0ece5;
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 12px;
      cursor: pointer;
    }
    .editor-form {
      display: grid;
      gap: 12px;
    }
    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .editor-form label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }
    .editor-form textarea {
      min-height: 110px;
      resize: vertical;
    }
    .editor-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 12px;
      z-index: 50;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.7);
      box-shadow: 0 20px 40px rgba(0,0,0,.12);
      border-radius: 22px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: min(360px, calc(100% - 20px));
      backdrop-filter: blur(12px);
    }
    .nav-fab {
      border: 0;
      border-radius: 16px;
      min-height: 48px;
      background: linear-gradient(180deg, #fff, #f4eee5);
      color: var(--text);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .toast {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 80;
      background: rgba(0,0,0,.86);
      color: #fff;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: .24s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 900px) {
      .utility-grid {
        grid-template-columns: 1fr;
      }
      .editor-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      body { padding-bottom: 94px; }
      .hero {
        min-height: 110px;
        border-radius: 0 0 24px 24px;
      }
      .hero-inner { padding-top: 10px; }
      .topbar {
        flex-direction: row;
        align-items: flex-start;
        margin-bottom: 8px;
        justify-content: center;
      }
      .top-actions {
        width: auto;
        justify-content: center;
      }
      .hero-copy h1 {
        font-size: clamp(17px, 5.4vw, 24px);
      }
      .hero-copy p {
        font-size: 11px;
      }
      .rates {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .rate-card {
        padding: 7px 4px;
      }
      .rate-card small {
        font-size: 8px;
      }
      .rate-card strong {
        font-size: 12px;
      }
      .slider-stage {
        height: 160px;
      }
      .slider-caption strong {
        font-size: 18px;
      }
      .categories-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .filters {
        grid-template-columns: 1fr 1fr;
      }
      .chip {
        font-size: 12px;
        min-height: 44px;

      if (!String(item.media).startsWith("idb://")) return item.media;
      if (item.cat && FALLBACKS[item.cat]) return FALLBACKS[item.cat];
      if (item.id && FALLBACKS[item.id]) return FALLBACKS[item.id];
      return FALLBACKS.generic;
    }

    function mediaMarkup(item, className = "card-media") {
      const source = safeMedia(item);
      if (item && item.mediaType === "video" && !String(source).startsWith("idb://")) {
        return `
          <div class="${className}">
            <video autoplay muted loop playsinline controls>
              <source src="${source}">
            </video>
          </div>
        `;
      }
      return `
        <div class="${className}">
          <img src="${source}" alt="">
        </div>
      `;
    }

    function renderCalculator() {
      const currencyEl = document.getElementById("calcCurrency");
      const modeEl = document.getElementById("calcMode");
      const amountEl = document.getElementById("calcAmount");
      const resultInput = document.getElementById("calcResult");
      if (!currencyEl || !modeEl || !amountEl || !resultInput) return;
      const currency = currencyEl.value;
      const mode = modeEl.value;
      const amount = Number(amountEl.value || 0);
      if (!amount) {
        resultInput.value = "";
        return;
      }
      const key = currency.toLowerCase();
      const rate = getAdjustedRate(data.rates[key]);
      if (!rate) {
        resultInput.value = "";
        return;
      }
      if (mode === "toTry") {
        resultInput.value = (amount * rate).toFixed(2) + " TRY";
      } else {
        resultInput.value = (amount / rate).toFixed(2) + " " + currency;
      }
    }

    function priceHTML(service) {

          <span class="price">${service.currency || ""}${service.price}</span>

    function whatsappLink(service) {
      const category = data.categories.find(cat => cat.id === service.cat);
      const text = encodeURIComponent([
        data.hotel.name,
        t(uiText.requestMessage),
        category ? t(category.name) : "",
        t(service.title),
        isFree(service) ? t(uiText.free) : `${service.currency || ""}${service.price}`
      ].filter(Boolean).join("\n"));
      const base = data.settings.whatsappLink || "https://wa.me/905375120434?utm_source=chatgpt.com";
      return base.includes("?") ? `${base}&text=${text}` : `${base}?text=${text}`;
    }

    function moveItem(list, id, direction) {
      const index = list.findIndex(item => item.id === id);
      if (index === -1) return;
      const next = index + direction;
      if (next < 0 || next >= list.length) return;
      const temp = list[index];
      list[index] = list[next];
      list[next] = temp;
      list.forEach((item, order) => item.order = order);
      saveState();
      renderAll();
    }

    function moveCategory(id, direction) {
      moveItem(data.categories, id, direction);
    }

          </div>
          <div class="editor-actions">
            <button class="save-btn" type="button" id="saveGithubConfig">Save</button>
          </div>
        </div>
      `);
      document.getElementById("saveGithubConfig").onclick = () => {
        data.settings.adminPassword = document.getElementById("adminPasswordInput").value.trim() || "peker1903";
        data.settings.github = {
          ...github,
          enabled: document.getElementById("ghEnabledInput").value === "true",
          owner: document.getElementById("ghOwnerInput").value.trim(),
          repo: document.getElementById("ghRepoInput").value.trim(),
          branch: document.getElementById("ghBranchInput").value.trim() || "main",
          path: document.getElementById("ghPathInput").value.trim() || "index.html",
          token: document.getElementById("ghTokenInput").value.trim()
        };
        saveState(false);
        closeModal();
      };
    }

    async function saveToGithub() {
      const github = data.settings.github;
      if (!github || !github.enabled || !github.owner || !github.repo || !github.token) return;
      try {
        const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        const content = btoa(unescape(encodeURIComponent(html)));
        const body = {
          message: "Auto save from PEKER HOTEL admin panel",
          content,
          branch: github.branch || "main"
        };
        if (github.sha) body.sha = github.sha;

        const response = await fetch(`https://api.github.com/repos/${github.owner}/${github.repo}/contents/${github.path || "index.html"}`, {
          method: "PUT",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${github.token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });

        const json = await response.json();
        if (!response.ok) {
          throw new Error(json.message || "GitHub save failed");
        }
        data.settings.github.sha = json.content?.sha || data.settings.github.sha || "";
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        toast("Saved to GitHub");
      } catch (error) {
        console.error(error);
        toast("GitHub save failed");
      }
    }

    function queueGithubSave() {
      clearTimeout(queueGithubSave.timer);
      queueGithubSave.timer = setTimeout(saveToGithub, 1400);
    }

    function goHome() {
      activeCategory = "all";
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function moveHorizontal(step) {
      if (!data.categories.length) return;
      const ids = data.categories.map(item => item.id);
      let index = ids.indexOf(activeCategory);
      if (index === -1) index = 0;
      index = Math.max(0, Math.min(ids.length - 1, index + step));
      activeCategory = ids[index];
      renderAll();
      document.getElementById("servicesGrid").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    window.editCategory = editCategory;
    window.editService = editService;
    window.editBanner = editBanner;
    window.moveCategory = moveCategory;
    window.moveService = moveService;
    window.moveBanner = moveBanner;

    loadState();
    if (!data.settings) data.settings = {};
    if (!data.settings.adminPassword || data.settings.adminPassword === "1234") {
      data.settings.adminPassword = "peker1903";
    }
    buildDefaultBanners();

    languageSelect.value = currentLang;
    languageSelect.addEventListener("change", e => {
      currentLang = e.target.value;
      renderAll();
    });

    document.getElementById("adminLoginBtn").addEventListener("click", promptAdminLogin);
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    document.getElementById("editHeroBtn").addEventListener("click", editHero);
    document.getElementById("editRatesBtn").addEventListener("click", editRates);
    document.getElementById("addBannerBtn").addEventListener("click", addBanner);
    document.getElementById("saveNowBtn").addEventListener("click", () => saveState());
    document.getElementById("githubConfigBtn").addEventListener("click", openGithubConfig);
    document.getElementById("navHomeBtn").addEventListener("click", goHome);
    document.getElementById("navBackBtn").addEventListener("click", () => moveHorizontal(-1));
    document.getElementById("navNextBtn").addEventListener("click", () => moveHorizontal(1));

    renderAll();
    startSlider();
  </script>
</body>
</html>
